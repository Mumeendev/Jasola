<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Jasola Model School</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                        url('https://plus.unsplash.com/premium_photo-1681680196967-1ebbf45bb4fd?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8cGljdHVyZSUyMG9mJTIwYSUyMGxhcHRvcHxlbnwwfHwwfHx8MA%3D%3D') no-repeat center center/cover;
            padding: 2rem;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .greeting {
            margin-bottom: 1rem;
        }

        .greeting p {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 500;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: #fff;
            font-size: 2rem;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .buttons-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
        }

        .action-btn {
            background: #fff;
            color: #2c5282;
            padding: 1.5rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .action-btn:active {
            transform: translateY(-1px);
        }

        .action-btn.primary {
            background: #2c5282;
            color: #fff;
        }

        .action-btn.primary:hover {
            background: #1a365d;
        }

        /* Navigation */
        nav {
            background: #fff;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c5282;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #2c5282;
        }
    </style>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <nav>
        <div class="logo">Jasola Model School</div>
        <ul class="nav-links">
            <li><a href="#download">School code</a></li>
        </ul>
    </nav>

    <div class="dashboard-container">
        <div class="greeting">
            <p id="user-greeting">Loading...</p>
        </div>
        <div class="header">
            <h1>Jasola Model School Portal</h1>
            <a href="login.html" class="logout-btn" onclick="logout()">Logout</a>
        </div>

        <div class="buttons-grid">
            <button class="action-btn primary" onclick="window.location.href='change-password.html'">Change Password</button>
            <button class="action-btn" onclick="window.location.href='personal-details.html'">Personal details</button>
            <button class="action-btn" onclick="window.location.href='add-user.html'">Add User</button>
            <button class="action-btn" onclick="window.location.href='view-users.html'">Manage Users</button>
            <button class="action-btn" onclick="window.location.href='add-learner.html'">Add Learner</button>
            <button class="action-btn" onclick="window.location.href='manage-learners.html'">Manage / Remove Learners</button>
            <button class="action-btn" onclick="window.location.href='add-subject.html'">Add Subject</button>
            <button class="action-btn" onclick="window.location.href='view-subjects.html'">Manage Subjects</button>
            <button class="action-btn" onclick="window.location.href='allocate-subject.html'">Allocate / Change Teacher Subjects</button>
            <button class="action-btn" onclick="window.location.href='add-class.html'">Add Class</button>
            <button class="action-btn" onclick="window.location.href='manage-classes.html'">Manage / Remove Classes</button>
            <button class="action-btn" onclick="window.location.href='upload-result.html'">Upload Result</button>
            <button class="action-btn" onclick="window.location.href='class-gradebook.html'">Class Gradebook</button>
            <button class="action-btn" onclick="window.location.href='report-cards.html'">Print report cards</button>
            <button class="action-btn" onclick="window.location.href='view-results.html'">Results</button>
            <button class="action-btn" onclick="window.location.href='more-options.html'">More Options</button>
            <button class="action-btn" onclick="handleAction('Reports')">Reports</button>
            <button class="action-btn" onclick="handleAction('Settings')">Settings</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Check if user is logged in
        if (!sessionStorage.getItem('token')) {
            window.location.href = 'login.html';
        }
        if (sessionStorage.getItem('role') === 'teacher') {
            window.location.replace('teacher-dashboard.html');
        } else if (sessionStorage.getItem('role') !== 'admin') {
            sessionStorage.clear();
            window.location.replace('login.html');
        }

        async function loadDashboard() {
            const username = sessionStorage.getItem('username');
            const greetingElement = document.getElementById('user-greeting');
            
            try {
                const baseUrl = window.location.protocol === 'file:' ? 'http://127.0.0.1:3000' : window.location.origin;
                const response = await fetch(`${baseUrl}/api/user/${username}`);
                const data = await response.json();

                if (response.ok) {
                    const name = data.othername || data.username;
                    const role = data.role ? data.role.charAt(0).toUpperCase() + data.role.slice(1) : 'User';
                    greetingElement.textContent = `Jasola, ${name} (${role})`;
                } else {
                    greetingElement.textContent = `Jasola, ${username}`;
                }
            } catch (err) {
                console.error('Error loading dashboard:', err);
                greetingElement.textContent = `Jasola, ${username}`;
            }
        }

        loadDashboard();

        function logout() {
            sessionStorage.removeItem('token');
            sessionStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('username');
            sessionStorage.removeItem('role');
            window.location.href = 'login.html';
        }

        function handleAction(actionName) {
            alert(actionName + ' - Feature coming soon!');
        }
    </script>
</body>
</html>
