<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasola Model School Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        /* Navigation */
        nav {
            background: #fff;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c5282;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #2c5282;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(-45deg, rgba(238, 119, 82, 0.85), rgba(231, 60, 126, 0.85), rgba(35, 166, 213, 0.85), rgba(35, 213, 171, 0.85), rgba(26, 54, 93, 0.85));
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
            margin-top: 60px;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .hero h1 {
            font-size: 3rem;
            color: #fff;
            margin-bottom: 1rem;
            max-width: 800px;
        }

        .hero p {
            font-size: 1.25rem;
            color: #e2e8f0;
            margin-bottom: 2rem;
            max-width: 600px;
        }

        .hero-btn {
            background: #fff;
            color: #2c5282;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .hero-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .hero-btn:active {
            transform: translateY(-1px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 1rem;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }
        }
    </style>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">Jasola Model School</div>
        <ul class="nav-links">
            <li><a href="#download">School code</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to Jasola Model School Portal</h1>
        <p>Empowering students with quality education and modern learning resources for a brighter future.</p>
        <a href="login.html" class="hero-btn" id="get-started-link">Get Started</a>
    </section>

    <script>
        async function checkServer() {
            const link = document.getElementById('get-started-link');
            let baseUrl;
            try {
                baseUrl = await resolvePortalApiBase();
                link.href = `${baseUrl}/login.html`;
            } catch (err) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('The portal server is not running!\n\nPlease start it with "npm start" before accessing the login page.');
                });
                link.title = 'Server is currently offline. Please start the server.';
                link.style.opacity = '0.7';
            }
        }
        const probeScript = document.createElement('script');
        probeScript.src = 'auth.js';
        probeScript.onload = checkServer;
        document.body.appendChild(probeScript);
    </script>
</body>
</html>
