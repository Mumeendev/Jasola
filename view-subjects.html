<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Subjects - Jasola Model School</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 2rem;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                        url('https://images.unsplash.com/photo-1434031211128-0c29b692f139?w=1920&q=80') no-repeat center center/cover;
        }

        .view-container {
            max-width: 1000px;
            margin: 2rem auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .view-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .view-header h1 {
            color: #1a202c;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        table th, table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        table th {
            background: #2c5282;
            color: #fff;
            font-weight: 600;
        }

        table tr:hover {
            background: #f7fafc;
        }

        .no-data {
            text-align: center;
            padding: 2rem;
            color: #718096;
            font-size: 1.1rem;
        }

        .bottom-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .bottom-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .bottom-btn.go-back {
            background: #718096;
            color: #fff;
        }

        .bottom-btn.add-more {
            background: #2c5282;
            color: #fff;
        }

        .bottom-btn.refresh {
            background: #38a169;
            color: #fff;
        }

        /* Navigation */
        nav {
            background: #fff;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c5282;
        }
    </style>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <nav>
        <div class="logo">Jasola Model School</div>
    </nav>

    <div class="view-container">
        <div class="view-header">
            <h1>All Subjects</h1>
            <p>List of all subjects registered in the database</p>
        </div>
        
        <div id="subjects-table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Subject Name</th>
                        <th>Category/Class</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="subjects-list">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>

        <div class="bottom-buttons">
            <a href="dashboard.html" class="bottom-btn go-back">Dashboard</a>
            <a href="add-subject.html" class="bottom-btn add-more">Add Subject</a>
            <button class="bottom-btn refresh" onclick="loadSubjects()">Refresh List</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        async function loadSubjects() {
            const list = document.getElementById('subjects-list');

            try {
                const baseUrl = await window.resolvePortalApiBase();
                const response = await fetch(`${baseUrl}/api/subjects?catalog=1`);
                const subjects = await response.json();
                if (!response.ok) throw new Error(subjects.error || 'Unable to load subjects.');

                if (subjects.length === 0) {
                    const row = document.createElement('tr');
                    const message = document.createElement('td');
                    message.className = 'no-data';
                    message.colSpan = 4;
                    message.textContent = 'No active subjects found. Use the "Add Subject" page to create one.';
                    row.appendChild(message);
                    list.replaceChildren(row);
                    return;
                }

                list.replaceChildren();
                const categoryNames = {
                    Creche: 'Creche (Reception, KG One–Two)',
                    Primary: 'Primary (Basic 1–5)',
                    'Junior Secondary': 'Junior Secondary (JSS 1–3)',
                    Secondary: 'Senior Secondary (SS 1–3)'
                };
                subjects.forEach((subject, index) => {
                    const row = document.createElement('tr');
                    [index + 1, subject.name,
                        categoryNames[subject.class_name] || subject.class_name
                    ].forEach(value => {
                        const cell = document.createElement('td');
                        cell.textContent = String(value || '');
                        row.appendChild(cell);
                    });
                    const action = document.createElement('td');
                    const archiveButton = document.createElement('button');
                    archiveButton.type = 'button';
                    archiveButton.textContent = 'Remove';
                    archiveButton.addEventListener('click', () => archiveSubject(subject));
                    action.appendChild(archiveButton);
                    row.appendChild(action);
                    list.appendChild(row);
                });
            } catch (err) {
                const row = document.createElement('tr');
                const message = document.createElement('td');
                message.className = 'no-data';
                message.colSpan = 4;
                message.textContent = err.message || 'Unable to load subjects.';
                row.appendChild(message);
                list.replaceChildren(row);
            }
        }

        async function archiveSubject(subject) {
            if (!confirm(`Remove ${subject.name} from the active subject catalog? Existing allocations and saved results will be preserved.`)) return;
            try {
                const baseUrl = await window.resolvePortalApiBase();
                const response = await fetch(`${baseUrl}/api/subjects/${encodeURIComponent(subject.id)}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to remove subject.');
                await loadSubjects();
            } catch (error) {
                alert(error.message || 'Unable to remove subject.');
            }
        }

        loadSubjects();
    </script>
</body>
</html>
