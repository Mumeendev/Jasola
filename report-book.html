<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Report Cards - Jasola Model School</title>
    <style>
        * { box-sizing:border-box; }
        body { margin:0; padding:1.5rem; background:#edf2f7; color:#1a202c; font-family:Arial,Helvetica,sans-serif; }
        main { max-width:1000px; margin:0 auto; }
        .toolbar { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem; }
        .toolbar button,.toolbar a { padding:.7rem 1rem; border:0; border-radius:5px; background:#2c5282; color:#fff; text-decoration:none; cursor:pointer; }
        #status { color:#4a5568; }
        .report-card { min-height:250mm; margin:0 auto 1.5rem; padding:12mm; background:#fff; border:1px solid #cbd5e0; box-shadow:0 3px 12px #00000012; }
        .school-header { text-align:center; border-bottom:3px double #2c5282; padding-bottom:.7rem; }
        .school-header h1 { margin:.2rem; color:#1a365d; font-size:22pt; letter-spacing:.06em; }
        .school-header p { margin:.2rem; font-size:10pt; color:#4a5568; }
        .school-header .school-levels { display:flex; justify-content:center; align-items:center; gap:.7rem; font-weight:700; letter-spacing:.08em; color:#2c5282; }
        .school-header .school-levels span + span { padding-left:.7rem; border-left:2px solid #2c5282; }
        .school-header .school-address { font-size:9pt; }
        .school-brand { display:flex; flex-direction:column; align-items:center; gap:.3rem; }
        .school-logo { width:82px; height:82px; object-fit:contain; }
        .report-title { margin:1rem 0; text-align:center; text-transform:uppercase; letter-spacing:.12em; }
        .student-details { display:grid; grid-template-columns:2fr 1fr 1fr 90px; gap:.55rem 1rem; margin:1rem 0; padding:.8rem; border:1px solid #a0aec0; background:#f7fafc; }
        .student-details strong { color:#2d3748; }
        .student-attendance { grid-column:3; grid-row:2; }
        .student-attendance table { margin-top:.3rem; font-size:8pt; }
        .student-attendance th,.student-attendance td { padding:.2rem .3rem; }
        .student-passport { grid-column:4; grid-row:1 / span 2; }
        .student-passport img { width:82px; height:100px; object-fit:cover; border:1px solid #a0aec0; }
        table { width:100%; border-collapse:collapse; font-size:10pt; }
        .scores-table { font-size:8pt; }
        th,td { padding:.48rem; border:1px solid #718096; text-align:center; }
        th { background:#e2e8f0; }
        th:first-child,td:first-child { text-align:left; }
        .marks-summary { width:min(360px,100%); margin:.4rem 0 1rem auto; }
        .marks-summary th:first-child,.marks-summary td:first-child { text-align:left; }
        .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; margin:1rem 0; }
        .summary div { padding:.65rem; border:1px solid #a0aec0; text-align:center; }
        .summary strong { display:block; margin-bottom:.2rem; font-size:9pt; }
        .remark { margin:.8rem 0; padding:.6rem; border:1px solid #a0aec0; min-height:2.5rem; }
        .behavior-panel { margin:1rem 0; }
        .behavior-panel h3 { margin:.5rem 0; }
        .behavior-groups { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.75rem; }
        .behavior-group h4 { margin:.4rem 0; color:#1a365d; }
        .behavior-group table { font-size:9pt; }
        .signatures { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; margin-top:2rem; text-align:center; }
        .signatures div { padding-top:.45rem; border-top:1px solid #4a5568; font-size:9pt; }
        .grade-key { margin-top:1rem; color:#4a5568; font-size:8.5pt; }
        .report-footer { display:grid; grid-template-columns:repeat(2,1fr); gap:.5rem; margin:.8rem 0; padding:.7rem; border:1px solid #a0aec0; background:#f7fafc; }
        .report-footer h3 { grid-column:1/-1; margin:.1rem 0; font-size:10pt; }
        .attendance-summary { margin:.8rem 0; }
        @page { size:A4 portrait; margin:10mm; }
        @media print {
            body { padding:0; background:#fff; }
            main { max-width:none; }
            .toolbar,#status { display:none !important; }
            .report-card { min-height:0; margin:0; padding:3mm; border:0; box-shadow:none; break-after:page; page-break-after:always; }
            .report-card:last-child { break-after:auto; page-break-after:auto; }
            th { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
        }
        @media (max-width:640px) {
            body { padding:.5rem; }
            .report-card { padding:1rem; }
            .student-details { grid-template-columns:1fr 1fr; }
            .report-card .student-details { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
            .student-attendance { grid-column:2; grid-row:auto; }
            .report-card .student-passport { grid-column:2; grid-row:1 / span 2; }
            .summary { grid-template-columns:1fr 1fr; }
            .behavior-groups { grid-template-columns:1fr; }
            .school-logo { width:62px; height:62px; }
            .school-brand { gap:.3rem; }
            .school-header h1 { font-size:16pt; }
        }
    </style>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <main>
        <div class="toolbar">
            <a id="back-link" href="report-cards.html">Back to selection</a>
            <button type="button" id="print-button">Print Report Cards</button>
        </div>
        <p id="status" role="status">Preparing report cards…</p>
        <section id="reports"></section>
    </main>
    <script src="auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const classId = Number(params.get('classId'));
        const term = params.get('term') || '';
        const sessionYear = params.get('sessionYear') || '';
        const learnerIdParam = params.get('learnerId');
        const learnerId = learnerIdParam === null ? null : Number(learnerIdParam);
        const resumptionDate = params.get('resumptionDate') || '';
        const schoolFees = params.get('schoolFees');
        const reports = document.getElementById('reports');
        const status = document.getElementById('status');
        const printButton = document.getElementById('print-button');
        const role = sessionStorage.getItem('role');
        let reportLoadPromise;
        if (role !== 'admin') {
            window.location.replace(role === 'teacher' ? 'teacher-dashboard.html' : 'login.html');
            printButton.disabled = true;
        }
        if (learnerId !== null) {
            printButton.textContent = 'Print This Report Card';
        }

        function gradeFor(total) {
            if (total >= 70) return ['A', 'Excellent'];
            if (total >= 60) return ['B', 'Very Good'];
            if (total >= 50) return ['C', 'Good'];
            if (total >= 45) return ['D', 'Credit'];
            if (total >= 40) return ['E', 'Pass'];
            return ['F', 'Needs Improvement'];
        }

        function ordinal(value) {
            const remainder = value % 100;
            const suffix = remainder >= 11 && remainder <= 13
                ? 'th'
                : value % 10 === 1 ? 'st' : value % 10 === 2 ? 'nd' : value % 10 === 3 ? 'rd' : 'th';
            return `${value}${suffix}`;
        }

        function addCell(row, value, tag = 'td') {
            const cell = document.createElement(tag);
            cell.textContent = value === null || value === undefined || value === '' ? '—' : String(value);
            row.appendChild(cell);
            return cell;
        }

        function makeReport(learner, subjects, scoresByKey, commentsByLearner, behaviorsByLearner,
            behaviorSkillGroups, attendanceByLearner, positionsBySubject, classInfo,
            classHighest, classLowest, subjectScoreExtremes) {
            const card = document.createElement('article');
            card.className = 'report-card';
            const school = document.createElement('div');
            school.className = 'school-header';
            const brand = document.createElement('div');
            brand.className = 'school-brand';
            const logo = document.createElement('img');
            logo.className = 'school-logo';
            logo.src = 'images/WhatsApp%20Image%202026-11-11%20at%206.03.41%20PM.jpeg';
            logo.alt = 'Jasola Model School logo';
            const schoolName = document.createElement('h1');
            schoolName.textContent = 'JASOLA MODEL SCHOOL';
            const schoolPhone = document.createElement('p');
            schoolPhone.className = 'school-phone';
            schoolPhone.textContent = 'Phone: 09034695566';
            const schoolLevels = document.createElement('p');
            schoolLevels.className = 'school-levels';
            const crecheLevel = document.createElement('span');
            crecheLevel.textContent = 'CRECHE';
            const basicLevel = document.createElement('span');
            basicLevel.textContent = 'BASIC';
            const collegeLevel = document.createElement('span');
            collegeLevel.textContent = 'COLLEGE';
            schoolLevels.append(crecheLevel, basicLevel, collegeLevel);
            const address = document.createElement('p');
            address.className = 'school-address';
            address.textContent = '9A Temidire Street, Ganmo, Kwara State';
            const reportDescription = document.createElement('p');
            reportDescription.textContent = 'ACADEMIC PERFORMANCE REPORT';
            brand.append(logo, schoolName, schoolPhone);
            school.append(brand, schoolLevels, address, reportDescription);
            const title = document.createElement('h2');
            title.className = 'report-title';
            title.textContent = `${term} Report`;
            card.append(school, title);

            const details = document.createElement('div');
            details.className = 'student-details';
            [
                ['Learner', `${learner.surname} ${learner.othername}`],
                ['Class', `${classInfo.class_name} - ${classInfo.section}${classInfo.stream ? ` (${classInfo.stream})` : ''}`],
                ['Academic Session', sessionYear]
            ].forEach(([label, value]) => {
                const field = document.createElement('div');
                const strong = document.createElement('strong');
                strong.textContent = `${label}: `;
                field.append(strong, document.createTextNode(value));
                details.appendChild(field);
            });
            if (learner.passport_photo) {
                const passport = document.createElement('div');
                passport.className = 'student-passport';
                const image = document.createElement('img');
                image.src = learner.passport_photo;
                image.alt = `Passport photo of ${learner.surname} ${learner.othername}`;
                passport.appendChild(image);
                details.appendChild(passport);
            }
            const attendance = attendanceByLearner.get(learner.id);
            const daysPresent = attendance ? Number(attendance.days_present) : null;
            const daysSchoolOpen = attendance ? Number(attendance.days_school_open) : null;
            const attendanceField = document.createElement('div');
            attendanceField.className = 'student-attendance';
            const attendanceLabel = document.createElement('strong');
            attendanceLabel.textContent = 'Attendance';
            const attendanceTable = document.createElement('table');
            const attendanceBody = document.createElement('tbody');
            [
                ['Days absent', daysPresent === null || daysSchoolOpen === null
                    ? null
                    : daysSchoolOpen - daysPresent],
                ['Days present', daysPresent]
            ].forEach(([label, count]) => {
                const row = document.createElement('tr');
                addCell(row, label, 'th');
                addCell(row, count);
                attendanceBody.appendChild(row);
            });
            attendanceTable.appendChild(attendanceBody);
            attendanceField.append(attendanceLabel, attendanceTable);
            details.appendChild(attendanceField);
            card.appendChild(details);

            const table = document.createElement('table');
            table.className = 'scores-table';
            const head = document.createElement('thead');
            const header = document.createElement('tr');
            ['Subject', 'CA1 /20', 'CA2 /20', 'Exam /60', 'Total /100', 'Highest score', 'Lowest score', 'Position', 'Grade', 'Remark'].forEach(label => addCell(header, label, 'th'));
            head.appendChild(header);
            table.appendChild(head);
            const body = document.createElement('tbody');
            const learnerScores = [];
            subjects.forEach(subject => {
                const score = scoresByKey.get(`${learner.id}:${subject.id}`);
                const row = document.createElement('tr');
                addCell(row, subject.stream ? `${subject.name} (${subject.stream})` : subject.name);
                addCell(row, score && score.ca1);
                addCell(row, score && score.ca2);
                addCell(row, score && score.exam);
                const total = score ? Number(score.ca1) + Number(score.ca2) + Number(score.exam) : null;
                addCell(row, total === null ? null : total.toFixed(2));
                const extremes = subjectScoreExtremes.get(subject.id);
                addCell(row, extremes ? extremes.highest.toFixed(2) : null);
                addCell(row, extremes ? extremes.lowest.toFixed(2) : null);
                const subjectPosition = positionsBySubject.get(`${subject.id}:${learner.id}`);
                addCell(row, subjectPosition ? ordinal(subjectPosition.rank) : null);
                const grade = total === null ? null : gradeFor(total);
                addCell(row, grade && grade[0]);
                addCell(row, grade && grade[1]);
                if (total !== null) learnerScores.push(total);
                body.appendChild(row);
            });
            if (!subjects.length) {
                const emptyRow = document.createElement('tr');
                const emptyCell = addCell(emptyRow, 'No results have been uploaded for this learner.');
                emptyCell.colSpan = 10;
                body.appendChild(emptyRow);
            }
            table.appendChild(body);
            card.appendChild(table);

            const marksSummary = document.createElement('table');
            marksSummary.className = 'marks-summary';
            const marksHead = document.createElement('thead');
            const marksHeader = document.createElement('tr');
            addCell(marksHeader, 'Marks summary', 'th');
            addCell(marksHeader, 'Score', 'th');
            marksHead.appendChild(marksHeader);
            marksSummary.appendChild(marksHead);
            const marksBody = document.createElement('tbody');
            [
                ['Mark obtained', learnerScores.reduce((sum, score) => sum + score, 0).toFixed(2)],
                ['Mark obtainable', subjects.length ? (subjects.length * 100).toFixed(2) : '—']
            ].forEach(([label, value]) => {
                const row = document.createElement('tr');
                addCell(row, label);
                addCell(row, value);
                marksBody.appendChild(row);
            });
            marksSummary.appendChild(marksBody);
            card.appendChild(marksSummary);

            const totalScore = learnerScores.reduce((sum, score) => sum + score, 0);
            const mean = learnerScores.length ? totalScore / learnerScores.length : null;
            const totalObtainable = subjects.length * 100;
            const summary = document.createElement('div');
            summary.className = 'summary';
            [
                ['Total percentage', totalObtainable ? `${(totalScore / totalObtainable * 100).toFixed(2)}%` : '—'],
                ['Class highest', classHighest === null ? '—' : `${classHighest.toFixed(2)}%`],
                ['Class lowest', classLowest === null ? '—' : `${classLowest.toFixed(2)}%`],
                ['Overall grade', mean === null ? '—' : gradeFor(mean)[0]]
            ].forEach(([label, value]) => {
                const item = document.createElement('div');
                const strong = document.createElement('strong');
                strong.textContent = label;
                item.append(strong, document.createTextNode(value));
                summary.appendChild(item);
            });
            card.appendChild(summary);

            const behaviorRatings = behaviorsByLearner.get(learner.id) || {};
            const behaviorPanel = document.createElement('section');
            behaviorPanel.className = 'behavior-panel';
            const behaviorTitle = document.createElement('h3');
            behaviorTitle.textContent = 'Affective & Psychomotor Traits';
            behaviorPanel.appendChild(behaviorTitle);
            const behaviorGroups = document.createElement('div');
            behaviorGroups.className = 'behavior-groups';
            ['Psychomotor Traits', 'Affective Traits'].forEach(category => {
                const group = behaviorSkillGroups.find(item => item.category === category);
                if (!group) return;
                const groupPanel = document.createElement('section');
                groupPanel.className = 'behavior-group';
                const groupTitle = document.createElement('h4');
                groupTitle.textContent = group.category;
                const behaviorTable = document.createElement('table');
                const behaviorHead = document.createElement('thead');
                const behaviorHeader = document.createElement('tr');
                addCell(behaviorHeader, 'Skill', 'th');
                addCell(behaviorHeader, 'Rating', 'th');
                behaviorHead.appendChild(behaviorHeader);
                behaviorTable.appendChild(behaviorHead);
                const behaviorBody = document.createElement('tbody');
                group.skills.forEach(skill => {
                    const row = document.createElement('tr');
                    addCell(row, skill);
                    addCell(row, behaviorRatings[skill] || '—');
                    behaviorBody.appendChild(row);
                });
                behaviorTable.append(behaviorBody);
                groupPanel.append(groupTitle, behaviorTable);
                behaviorGroups.appendChild(groupPanel);
            });
            behaviorPanel.appendChild(behaviorGroups);
            card.appendChild(behaviorPanel);

            const comments = commentsByLearner.get(learner.id) || {};
            [
                ["Teacher's comment", comments.teacher_comment || 'No teacher comment.'],
                ["Principal's comment", comments.principal_comment || 'No principal comment.']
            ].forEach(([label, text]) => {
                const comment = document.createElement('p');
                comment.className = 'remark';
                const heading = document.createElement('strong');
                heading.textContent = `${label}: `;
                comment.append(heading, document.createTextNode(text));
                card.appendChild(comment);
            });

            if (resumptionDate || (schoolFees !== null && schoolFees !== '' &&
                Number.isFinite(Number(schoolFees)))) {
                const footer = document.createElement('section');
                footer.className = 'report-footer';
                const heading = document.createElement('h3');
                heading.textContent = 'Next Term Details';
                footer.appendChild(heading);
                if (resumptionDate) {
                    const resume = document.createElement('div');
                    const resumeLabel = document.createElement('strong');
                    resumeLabel.textContent = 'School resumes: ';
                    resume.append(resumeLabel, document.createTextNode(
                        new Date(`${resumptionDate}T00:00:00`).toLocaleDateString('en-NG', {
                            day: 'numeric', month: 'long', year: 'numeric'
                        })
                    ));
                    footer.appendChild(resume);
                }
                if (schoolFees !== null && schoolFees !== '' && Number.isFinite(Number(schoolFees))) {
                    const fee = document.createElement('div');
                    const feeLabel = document.createElement('strong');
                    feeLabel.textContent = 'School fees: ';
                    fee.append(feeLabel, document.createTextNode(
                        `NGN ${Number(schoolFees).toLocaleString('en-NG')}`
                    ));
                    footer.appendChild(fee);
                }
                card.appendChild(footer);
            }

            const signatures = document.createElement('div');
            signatures.className = 'signatures';
            ['Class Teacher', 'Principal', 'Parent / Guardian'].forEach(label => {
                const line = document.createElement('div');
                line.textContent = `${label} Signature and Date`;
                signatures.appendChild(line);
            });
            card.appendChild(signatures);

            const key = document.createElement('p');
            key.className = 'grade-key';
            key.textContent = 'Grading: A 70–100 Excellent | B 60–69 Very Good | C 50–59 Good | D 45–49 Credit | E 40–44 Pass | F 0–39 Needs Improvement. Overall averages include subjects with recorded scores only.';
            card.appendChild(key);
            return { card, average: mean };
        }

        async function loadReports() {
            if (!Number.isInteger(classId) || classId <= 0 || !term || !sessionYear ||
                (learnerId !== null && (!Number.isInteger(learnerId) || learnerId <= 0))) {
                status.textContent = 'Invalid report selection. Return to the report-card page and select a class, term, and session.';
                return;
            }
            try {
                const baseUrl = await window.resolvePortalApiBase();
                const query = new URLSearchParams({ classId: String(classId), term, sessionYear });
                const response = await fetch(`${baseUrl}/api/report-cards?${query}`, { cache: 'no-store' });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to prepare report cards.');
                const selectedLearners = learnerId === null
                    ? data.learners
                    : data.learners.filter(learner => learner.id === learnerId);
                if (learnerId !== null && !selectedLearners.length) {
                    status.textContent = 'The selected learner is not registered in this class.';
                    return false;
                }
                const scores = new Map(data.scores.map(score => [
                    `${score.learner_id}:${score.subject_id}`, score
                ]));
                const subjectScoreExtremes = new Map();
                data.scores.forEach(score => {
                    const total = Number(score.ca1) + Number(score.ca2) + Number(score.exam);
                    const current = subjectScoreExtremes.get(score.subject_id);
                    subjectScoreExtremes.set(score.subject_id, current
                        ? { highest: Math.max(current.highest, total), lowest: Math.min(current.lowest, total) }
                        : { highest: total, lowest: total });
                });
                const commentsByLearner = new Map((data.comments || []).map(comment => [
                    comment.learner_id, comment
                ]));
                const behaviorsByLearner = new Map((data.behaviors || []).map(behavior => [
                    behavior.learner_id, behavior.ratings
                ]));
                const attendanceByLearner = new Map((data.attendance || []).map(attendance => [
                    attendance.learner_id, attendance
                ]));
                const positionsBySubject = new Map();
                data.subjects.forEach(subject => {
                    const rankedScores = data.learners.map(learner => {
                        const score = scores.get(`${learner.id}:${subject.id}`);
                        return score ? {
                            learnerId: learner.id,
                            total: Number(score.ca1) + Number(score.ca2) + Number(score.exam)
                        } : null;
                    }).filter(Boolean).sort((left, right) => right.total - left.total);
                    rankedScores.forEach((item, index) => {
                        const rank = rankedScores.findIndex(candidate => candidate.total === item.total) + 1;
                        positionsBySubject.set(`${subject.id}:${item.learnerId}`, {
                            rank
                        });
                    });
                });
                const allSummaries = data.learners.map(learner => {
                    const totals = data.subjects
                        .map(subject => scores.get(`${learner.id}:${subject.id}`))
                        .filter(Boolean)
                        .map(score => Number(score.ca1) + Number(score.ca2) + Number(score.exam));
                    const average = totals.length
                        ? totals.reduce((sum, total) => sum + total, 0) / totals.length
                        : null;
                    return { learner, average };
                });
                const ranked = allSummaries.filter(item => item.average !== null)
                    .sort((left, right) => right.average - left.average);
                const summaries = learnerId === null
                    ? allSummaries
                    : allSummaries.filter(item => item.learner.id === learnerId);
                reports.replaceChildren();
                summaries.forEach(summary => {
                    const learnerSubjects = data.subjects.filter(subject =>
                        scores.has(`${summary.learner.id}:${subject.id}`)
                    );
                    const report = makeReport(
                        summary.learner, learnerSubjects, scores, commentsByLearner,
                        behaviorsByLearner, data.behaviorSkillGroups || [],
                        attendanceByLearner, positionsBySubject, data.class,
                        ranked.length ? ranked[0].average : null,
                        ranked.length ? ranked[ranked.length - 1].average : null,
                        subjectScoreExtremes
                    );
                    reports.appendChild(report.card);
                });
                status.textContent = selectedLearners.length
                    ? learnerId === null
                        ? `${selectedLearners.length} report card(s) prepared for ${data.class.class_name} - ${data.class.section}. Use Print Report Cards to print.`
                        : `Report card for ${selectedLearners[0].surname} ${selectedLearners[0].othername} is ready to print.`
                    : 'No learners are registered in this class.';
                return selectedLearners.length > 0;
            } catch (error) {
                status.textContent = error.message || 'Unable to prepare report cards.';
                return false;
            }
        }

        if (role === 'admin') printButton.addEventListener('click', async () => {
            printButton.disabled = true;
            const printLabel = printButton.textContent;
            printButton.textContent = 'Refreshing report cards…';
            try {
                if (reportLoadPromise) await reportLoadPromise;
                if (await loadReports()) window.print();
            } finally {
                printButton.disabled = false;
                printButton.textContent = printLabel;
            }
        });

        if (role === 'admin') reportLoadPromise = loadReports();
    </script>
</body>
</html>
