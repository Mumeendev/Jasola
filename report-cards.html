<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Report Cards - Jasola Model School</title>
    <style>
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem; background:#edf2f7; color:#1a202c; font-family:'Segoe UI',Tahoma,sans-serif; }
        main { width:100%; max-width:620px; padding:2rem; background:#fff; border-radius:10px; box-shadow:0 4px 16px #00000014; }
        h1 { margin-top:0; color:#1a365d; }
        label { display:block; margin:1.2rem 0 .4rem; font-weight:600; }
        select,input { width:100%; padding:.8rem; border:1px solid #cbd5e0; border-radius:5px; font-size:1rem; }
        button,.button { display:inline-block; margin:1rem .5rem 0 0; padding:.8rem 1rem; border:0; border-radius:5px; background:#2c5282; color:#fff; text-decoration:none; cursor:pointer; }
        #status { color:#4a5568; }
        #comments-panel { margin-top:1.5rem; padding:1rem; border:1px solid #cbd5e0; border-radius:6px; }
        #comments-panel[hidden] { display:none; }
        #learner-picker { margin-top:1rem; padding:1rem; border:1px solid #cbd5e0; border-radius:6px; }
        #learner-picker[hidden] { display:none; }
        .learner-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.65rem; }
        .learner-choice { width:100%; min-height:48px; margin:0; text-align:left; background:#fff; color:#1a365d; border:1px solid #a0aec0; overflow-wrap:anywhere; }
        .learner-choice:hover,.learner-choice:focus-visible { background:#ebf8ff; border-color:#2c5282; }
        .comment-row { display:grid; grid-template-columns:minmax(180px,1fr) minmax(240px,3fr); gap:.75rem; align-items:start; padding:.75rem 0; border-bottom:1px solid #e2e8f0; }
        .comment-row textarea { width:100%; min-height:70px; padding:.65rem; border:1px solid #cbd5e0; border-radius:5px; font:inherit; }
        .comment-name { font-weight:600; }
        #term-details-panel { margin-top:1rem; padding:1rem; border:1px solid #cbd5e0; border-radius:6px; }
        #term-details-panel[hidden] { display:none; }
        @media (max-width:640px) { .comment-row { grid-template-columns:1fr; } }
    </style>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <main>
        <h1>Print Class Report Cards</h1>
        <p>Choose a class, term, and session to view the learners in that class. Select a learner to open and print their report card.</p>
        <form id="report-form">
            <label for="class">Class and section</label>
            <select id="class" required><option value="">Loading classes…</option></select>
            <label for="term">Term</label>
            <select id="term" required>
                <option value="">Select term</option>
                <option>First Term</option>
                <option>Second Term</option>
                <option>Third Term</option>
            </select>
            <label for="session">Academic session</label>
            <input id="session" type="text" inputmode="numeric" pattern="[0-9]{4}/[0-9]{4}"
                   placeholder="e.g. 2026/2027" list="session-options" title="Enter the session as YYYY/YYYY" required>
            <datalist id="session-options">
                <option value="2025/2026"></option>
                <option value="2026/2027"></option>
                <option value="2027/2028"></option>
            </datalist>
            <button type="submit" id="show-learners-button">Show Learners</button>
            <button type="button" id="load-comments-button">Principal Comments</button>
            <button type="button" id="term-details-button" aria-expanded="false">Add resumption date &amp; school fees</button>
            <a class="button" id="back-link" href="dashboard.html">Back to Dashboard</a>
        </form>
        <section id="term-details-panel" hidden>
            <h2>Next Term Details</h2>
            <label for="resumption-date">School resumes on</label>
            <input id="resumption-date" type="date">
            <label for="school-fees">School fees (NGN)</label>
            <input id="school-fees" type="number" min="0" step="0.01" placeholder="e.g. 25000">
        </section>
        <p id="status" role="status"></p>
        <section id="learner-picker" hidden>
            <h2>Select a learner</h2>
            <div id="learner-list" class="learner-list"></div>
        </section>
        <section id="comments-panel" hidden>
            <h2 id="comments-title">Principal Comments</h2>
            <p id="comments-description">Add or edit a principal comment for each learner.</p>
            <div id="comments-list"></div>
            <button type="button" id="save-comments-button">Save Comments</button>
        </section>
    </main>
    <script src="auth.js"></script>
    <script>
        const role = sessionStorage.getItem('role');
        const commentType = role === 'teacher' ? 'teacher' : 'principal';
        const commentLabel = commentType === 'teacher' ? "Teacher's" : "Principal's";
        if (role === 'teacher') {
            document.getElementById('back-link').href = 'teacher-dashboard.html';
            document.getElementById('back-link').textContent = 'Back to Teacher Page';
            document.getElementById('load-comments-button').textContent = 'Teacher Comments';
            document.getElementById('comments-title').textContent = 'Teacher Comments';
            document.getElementById('comments-description').textContent =
                'Add or edit a teacher comment for each learner. Leave a field empty to clear it.';
        }

        const commentPanel = document.getElementById('comments-panel');
        const commentsList = document.getElementById('comments-list');
        const learnerPicker = document.getElementById('learner-picker');
        const learnerList = document.getElementById('learner-list');
        const reportForm = document.getElementById('report-form');

        function clearLearnerList() {
            learnerPicker.hidden = true;
            learnerList.replaceChildren();
        }

        reportForm.addEventListener('input', clearLearnerList);
        reportForm.addEventListener('change', clearLearnerList);

        async function showLearners() {
            const classId = document.getElementById('class').value;
            const term = document.getElementById('term').value;
            const sessionYear = document.getElementById('session').value.trim();
            if (!classId || !term || !sessionYear) {
                document.getElementById('status').textContent =
                    'Select a class, term, and session before showing learners.';
                return;
            }

            const button = document.getElementById('show-learners-button');
            button.disabled = true;
            clearLearnerList();
            document.getElementById('status').textContent = 'Loading learners…';
            try {
                const baseUrl = await window.resolvePortalApiBase();
                const query = new URLSearchParams({ classId });
                const response = await fetch(`${baseUrl}/api/learners?${query}`);
                const learners = await response.json();
                if (!response.ok) throw new Error(learners.error || 'Unable to load learners.');

                learners.forEach(learner => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'learner-choice';
                    button.textContent = `${learner.surname} ${learner.othername}` +
                        (learner.admission_number ? ` (${learner.admission_number})` : '');
                    button.addEventListener('click', () => {
                        const reportQuery = new URLSearchParams({
                            classId,
                            term,
                            sessionYear,
                            learnerId: String(learner.id)
                        });
                        const resumptionDate = document.getElementById('resumption-date').value;
                        const schoolFees = document.getElementById('school-fees').value;
                        if (resumptionDate) reportQuery.set('resumptionDate', resumptionDate);
                        if (schoolFees) reportQuery.set('schoolFees', schoolFees);
                        window.location.href = `report-book.html?${reportQuery}`;
                    });
                    learnerList.appendChild(button);
                });
                learnerPicker.hidden = false;
                document.getElementById('status').textContent = learners.length
                    ? `${learners.length} learner(s) found. Select a name to view and print that report card.`
                    : 'No learners are registered in this class.';
            } catch (error) {
                document.getElementById('status').textContent = error.message || 'Unable to load learners.';
            } finally {
                button.disabled = false;
            }
        }

        async function loadLearnerComments() {
            const classId = document.getElementById('class').value;
            const term = document.getElementById('term').value;
            const sessionYear = document.getElementById('session').value.trim();
            if (!classId || !term || !sessionYear) {
                document.getElementById('status').textContent =
                    'Select a class, term, and session before loading learner comments.';
                return;
            }
            const button = document.getElementById('load-comments-button');
            button.disabled = true;
            try {
                const baseUrl = await window.resolvePortalApiBase();
                const query = new URLSearchParams({ classId, term, sessionYear, type: commentType });
                const response = await fetch(`${baseUrl}/api/learner-comments?${query}`);
                const learners = await response.json();
                if (!response.ok) throw new Error(learners.error || 'Unable to load learner comments.');
                commentsList.replaceChildren();
                learners.forEach(learner => {
                    const row = document.createElement('label');
                    row.className = 'comment-row';
                    const name = document.createElement('span');
                    name.className = 'comment-name';
                    name.textContent = `${learner.surname} ${learner.othername}` +
                        (learner.admission_number ? ` (${learner.admission_number})` : '');
                    const textarea = document.createElement('textarea');
                    textarea.maxLength = 2000;
                    textarea.value = learner.comment;
                    textarea.dataset.learnerId = String(learner.learner_id);
                    textarea.setAttribute('aria-label', `${commentLabel} comment for ${name.textContent}`);
                    textarea.placeholder = 'Write a report-card comment for this learner';
                    row.append(name, textarea);
                    commentsList.appendChild(row);
                });
                commentPanel.hidden = false;
                document.getElementById('status').textContent = learners.length
                    ? `${learners.length} learner comment(s) loaded. Save after editing.`
                    : 'No learners are registered in this class.';
            } catch (error) {
                document.getElementById('status').textContent = error.message || 'Unable to load learner comments.';
            } finally {
                button.disabled = false;
            }
        }

        document.getElementById('load-comments-button').addEventListener('click', loadLearnerComments);
        document.getElementById('term-details-button').addEventListener('click', event => {
            const panel = document.getElementById('term-details-panel');
            panel.hidden = !panel.hidden;
            event.currentTarget.setAttribute('aria-expanded', String(!panel.hidden));
        });
        document.getElementById('save-comments-button').addEventListener('click', async () => {
            const button = document.getElementById('save-comments-button');
            button.disabled = true;
            try {
                const baseUrl = await window.resolvePortalApiBase();
                const response = await fetch(`${baseUrl}/api/learner-comments`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        classId: Number(document.getElementById('class').value),
                        term: document.getElementById('term').value,
                        sessionYear: document.getElementById('session').value.trim(),
                        comments: [...commentsList.querySelectorAll('textarea')].map(input => ({
                            learnerId: Number(input.dataset.learnerId),
                            comment: input.value
                        })),
                        type: commentType
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to save learner comments.');
                document.getElementById('status').textContent =
                    `Saved ${commentType} comments for ${data.saved} learner(s). They will appear on report cards.`;
            } catch (error) {
                document.getElementById('status').textContent = error.message || 'Unable to save learner comments.';
            } finally {
                button.disabled = false;
            }
        });

        async function loadClasses() {
            const select = document.getElementById('class');
            try {
                const baseUrl = await window.resolvePortalApiBase();
                const response = await fetch(`${baseUrl}/api/classes`);
                const classes = await response.json();
                if (!response.ok) throw new Error(classes.error || 'Unable to load classes.');
                select.innerHTML = '<option value="">Select class and section</option>';
                classes.forEach(classRow => {
                    const option = document.createElement('option');
                    option.value = classRow.id;
                    option.textContent = `${classRow.class_name} - ${classRow.section}`;
                    select.appendChild(option);
                });
                if (!classes.length) {
                    select.innerHTML = '<option value="">No classes available</option>';
                    document.getElementById('status').textContent =
                        'Create a class and allocate subjects before printing report cards.';
                }
            } catch (error) {
                select.innerHTML = '<option value="">Unable to load classes</option>';
                document.getElementById('status').textContent = error.message;
            }
        }

        reportForm.addEventListener('submit', event => {
            event.preventDefault();
            showLearners();
        });
        loadClasses();
    </script>
</body>
</html>
