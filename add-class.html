<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Class - Jasola Model School</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f3f6fa; color: #1a202c; font-family: 'Segoe UI', Tahoma, sans-serif; }
        main { width: 100%; max-width: 560px; padding: 2rem; border-radius: 10px; background: #fff; box-shadow: 0 4px 16px #00000014; }
        h1 { margin-top: 0; }
        label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
        input, select { width: 100%; padding: .8rem; border: 1px solid #cbd5e0; border-radius: 5px; font-size: 1rem; }
        button, .back { display: inline-block; margin: 1rem .5rem 0 0; padding: .8rem 1rem; border: 0; border-radius: 5px; background: #2c5282; color: #fff; text-decoration: none; cursor: pointer; }
        #status { min-height: 1.5rem; }
    </style>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <main>
        <h1>Add Class</h1>
        <p>Enter the class, section, and the teacher responsible for the class.</p>
        <form id="class-form">
            <label for="class-name">Class name</label>
            <input id="class-name" name="className" placeholder="e.g. KG One, Basic 1, JSS One, or SS One" required maxlength="100">
            <div id="stream-field" hidden>
                <label for="stream">Senior secondary stream</label>
                <select id="stream" name="stream">
                    <option value="">Select stream</option>
                    <option value="Science">Science</option>
                    <option value="Arts">Arts</option>
                    <option value="Commercial">Commercial</option>
                </select>
                <p class="helper">This controls which stream-specific subjects can be allocated to this class.</p>
            </div>
            <label for="section">Section</label>
            <input id="section" name="section" placeholder="e.g. A" required maxlength="100">
            <label for="class-teacher">Class teacher</label>
            <select id="class-teacher" required><option value="">Loading teachers…</option></select>
            <button type="submit">Save Class</button>
            <a class="back" href="dashboard.html">Back to Dashboard</a>
            <a class="back" href="manage-classes.html">Manage / Remove Classes</a>
        </form>
        <p id="status" role="status"></p>
    </main>
    <script src="auth.js"></script>
    <script>
        const classNameInput = document.getElementById('class-name');
        const streamField = document.getElementById('stream-field');
        const streamSelect = document.getElementById('stream');

        function updateStreamField() {
            const isSeniorSecondary = /senior\s+secondary|(?:^|\b)sss?\s*[-.]?\s*(?:[1-3]|one|two|three)\b/i.test(classNameInput.value);
            streamField.hidden = !isSeniorSecondary;
            streamSelect.required = isSeniorSecondary;
            if (!isSeniorSecondary) streamSelect.value = '';
        }

        classNameInput.addEventListener('input', updateStreamField);

        async function loadTeachers() {
            const select = document.getElementById('class-teacher');
            try {
                const baseUrl = await window.resolvePortalApiBase();
                const response = await fetch(`${baseUrl}/api/teachers`);
                const teachers = await response.json();
                if (!response.ok) throw new Error(teachers.error || 'Unable to load teachers.');
                select.innerHTML = '<option value="">Select a teacher</option>';
                teachers.forEach(teacher => {
                    const option = document.createElement('option');
                    option.value = teacher.username;
                    option.textContent = `${teacher.surname} ${teacher.othername} (@${teacher.username})`;
                    select.appendChild(option);
                });
                if (!teachers.length) select.innerHTML = '<option value="">Add a teacher account first</option>';
            } catch (error) {
                select.innerHTML = '<option value="">Unable to load teachers</option>';
                document.getElementById('status').textContent = error.message;
            }
        }

        document.getElementById('class-form').addEventListener('submit', async event => {
            event.preventDefault();
            const status = document.getElementById('status');
            const payload = {
                className: document.getElementById('class-name').value.trim(),
                section: document.getElementById('section').value.trim(),
                classTeacher: document.getElementById('class-teacher').value,
                stream: streamSelect.value
            };
            try {
                const baseUrl = await window.resolvePortalApiBase();
                const response = await fetch(`${baseUrl}/api/classes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to create class.');
                status.textContent = `Class ${data.class.class_name} - ${data.class.section} created. You can now allocate subjects to a teacher.`;
                event.target.reset();
            } catch (error) {
                status.textContent = error.message;
            }
        });
        loadTeachers();
    </script>
</body>
</html>
